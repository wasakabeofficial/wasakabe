# src/presentation/i18n/translations.ts es un diccionario de traducciones:
# el mismo conjunto de claves se repite una vez por idioma (es/en/zh/ko/ru/ja)
# con textos distintos. El detector de duplicado (CPD) normaliza los literales
# de texto y por eso marca esos 6 bloques como "código duplicado" — un falso
# positivo conocido en archivos de i18n/locale. Se excluye solo del análisis
# de duplicación; el resto de reglas (bugs, code smells, etc.) sigue aplicando.
sonar.cpd.exclusions=src/presentation/i18n/translations.ts
